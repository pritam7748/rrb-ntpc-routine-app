name: rrb_ntpc_routine_app
description: "RRB NTPC Study Routine & Persistent Alarm Tracker"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: any
  shared_preferences: ^2.2.3
  local_auth: ^2.2.0
  audioplayers: ^6.0.0
  flutter_local_notifications: ^17.2.2
  uuid: ^4.4.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
